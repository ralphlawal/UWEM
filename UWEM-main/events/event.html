<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jesus Alive Nauru Crusade — Nur Futura Events</title>
  <meta name="description" content="Join the Jesus Alive Nauru Crusade — a global online crusade. Register for your free ticket and watch live on Zoom, TikTok and Instagram.">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #8B2C00;
      --gold:  #f5b041;
      --dark:  #080808;
      --card:  #111111;
      --card2: #181818;
      --light: #f0f0f0;
      --muted: #777;
      --border: rgba(255,255,255,0.07);
      --gold-border: rgba(245,176,65,0.18);
      --green: #34d399;
      --red:   #ef4444;
      --zoom:  #2D8CFF;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--light); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* ─── NOISE ─── */
    .noise { position: fixed; inset: 0; pointer-events: none; z-index: 900; opacity: .055;
      background: url('https://grainy-gradients.vercel.app/noise.svg'); }

    /* ─── HEADER ─── */
    header {
      background: rgba(8,8,8,.94); backdrop-filter: blur(16px);
      padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 999; border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 21px; display: flex; align-items: center; gap: 11px; color: #fff; text-decoration: none; }
    .nav { display: flex; gap: 18px; align-items: center; }
    .nav a { color: #bbb; text-decoration: none; font-weight: 500; font-size: .88rem; transition: color .25s; }
    .nav a:hover { color: var(--gold); }
    .nav .btn-home { background: rgba(139,44,0,.15); border: 1px solid var(--brand); color: #e8895a; padding: 6px 14px; border-radius: 50px; font-weight: 600; display: flex; gap: 7px; align-items: center; transition: .25s; font-size: .83rem; }
    .nav .btn-home:hover { background: var(--brand); color: #fff; }
    @media (max-width: 600px) { header { padding: 13px 16px; } .nav a:not(.btn-home) { display: none; } }

    /* ─── HERO ─── */
    .hero { position: relative; min-height: 62vh; display: flex; align-items: flex-end; padding: 7rem 2rem 3rem; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.32); }
    .hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, #080808 0%, rgba(8,8,8,.5) 45%, transparent 100%); }
    .hero-content { position: relative; z-index: 1; max-width: 780px; }
    .hero-badges { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: .95rem; }
    .badge { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .85rem; border-radius: 50px; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .badge-org  { background: rgba(245,176,65,.11); border: 1px solid rgba(245,176,65,.32); color: var(--gold); }
    .badge-live { background: rgba(239,68,68,.13); border: 1px solid rgba(239,68,68,.38); color: #f87171; }
    .live-dot   { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(1.5); } }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem,5.5vw,3.6rem); font-weight: 700; line-height: 1.1; color: #fff; margin-bottom: 1.1rem; }
    .hero h1 em { color: var(--gold); font-style: italic; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: .65rem; }
    .chip { display: flex; align-items: center; gap: .45rem; background: rgba(15,15,15,.88); backdrop-filter: blur(6px); border: 1px solid var(--border); padding: .42rem .95rem; border-radius: 8px; font-size: .84rem; }
    .chip i { color: var(--gold); font-size: 12px; }

    /* ─── LAYOUT ─── */
    .layout { max-width: 1180px; margin: 0 auto; padding: 3rem 2rem; display: grid; grid-template-columns: 1fr 356px; gap: 3rem; }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 2rem 1.2rem; } }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 2.2rem 0; }

    /* ─── SECTION LABELS ─── */
    .sec-label { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: #e8895a; font-weight: 700; margin-bottom: .8rem; }

    /* ─── ZOOM JOIN BOX ─── */
    .zoom-box {
      background: linear-gradient(135deg, rgba(45,140,255,.13), rgba(45,140,255,.04));
      border: 1px solid rgba(45,140,255,.35); border-radius: 18px;
      padding: 1.6rem 1.75rem; margin-bottom: 1.6rem;
      display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
    }
    .zoom-icon-wrap { width: 54px; height: 54px; background: var(--zoom); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .zoom-icon-wrap i { font-size: 24px; color: #fff; }
    .zoom-info { flex: 1; min-width: 160px; }
    .zoom-info h3 { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: .2rem; }
    .zoom-info p { font-size: .8rem; color: var(--muted); }
    .zoom-join-btn {
      display: inline-flex; align-items: center; gap: .55rem;
      background: var(--zoom); color: #fff; text-decoration: none;
      padding: .8rem 1.6rem; border-radius: 50px; font-weight: 700; font-size: .92rem;
      transition: all .22s; white-space: nowrap; box-shadow: 0 4px 20px rgba(45,140,255,.3);
      flex-shrink: 0;
    }
    .zoom-join-btn:hover { background: #1a7aff; box-shadow: 0 6px 26px rgba(45,140,255,.45); transform: translateY(-2px); }

    /* ─── COUNTDOWN ─── */
    .countdown-wrap { background: var(--card2); border: 1px solid var(--gold-border); border-radius: 16px; padding: 1.4rem 1.25rem; margin-bottom: 1.6rem; text-align: center; }
    .countdown-grid { display: flex; gap: .6rem; justify-content: center; margin-top: .85rem; }
    .cd-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .9rem .5rem; flex: 1; max-width: 78px; }
    .cd-box span { font-family: 'Playfair Display', serif; font-size: 1.85rem; font-weight: 700; color: var(--gold); display: block; line-height: 1; }
    .cd-box label { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: .3rem; display: block; }
    .cd-live { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--green); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: .5rem; }

    /* ─── SOCIAL WATCH LINKS ─── */
    .watch-links { display: flex; gap: .65rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
    .watch-btn { display: inline-flex; align-items: center; gap: .55rem; padding: .7rem 1.3rem; border-radius: 10px; font-weight: 700; font-size: .875rem; text-decoration: none; transition: all .22s; border: 1px solid transparent; white-space: nowrap; color: #fff; }
    .watch-btn:hover { transform: translateY(-2px); }
    .watch-tiktok    { background: #111; border-color: #333; }
    .watch-tiktok:hover    { border-color: #69c9d0; box-shadow: 0 6px 18px rgba(105,201,208,.2); }
    .watch-instagram { background: linear-gradient(135deg,#405de6,#833ab4,#e1306c,#fd1d1d); }
    .watch-instagram:hover { opacity: .88; box-shadow: 0 6px 18px rgba(225,48,108,.3); }

    /* ─── SHARE / CALENDAR BAR ─── */
    .action-bar { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .action-btn { display: inline-flex; align-items: center; gap: .48rem; background: var(--card2); border: 1px solid var(--border); color: var(--light); padding: .58rem 1.1rem; border-radius: 50px; font-size: .83rem; font-weight: 600; cursor: pointer; transition: all .2s; text-decoration: none; font-family: 'Inter', sans-serif; }
    .action-btn:hover { border-color: var(--gold-border); color: var(--gold); }
    .action-btn i { color: var(--gold); font-size: 12px; }

    /* ─── ABOUT / DETAILS ─── */
    .detail-block { margin-bottom: 2rem; }
    .detail-block h2 { font-family: 'Playfair Display', serif; font-size: 1.45rem; font-weight: 700; margin-bottom: .7rem; color: #fff; }
    .detail-block p { color: var(--muted); line-height: 1.85; font-size: .93rem; }
    .detail-block p + p { margin-top: .7rem; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; margin-top: 1rem; }
    .info-box { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; }
    .info-box-label { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .28rem; }
    .info-box-value { font-family: 'Playfair Display', serif; font-size: .88rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .info-box-value.gold { color: var(--gold); }
    .info-box-value.green { color: var(--green); }

    /* ─── STREAM / SOCIAL LINK ROWS ─── */
    .link-list { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
    a.link-row, div.link-row {
      display: flex; align-items: center; gap: .75rem;
      background: var(--card2); border: 1px solid var(--border);
      padding: .8rem 1rem; border-radius: 11px; font-size: .875rem;
      text-decoration: none; color: var(--light); transition: all .22s;
    }
    a.link-row:hover { border-color: var(--gold-border); transform: translateX(3px); }
    .link-icon { width: 34px; height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-arrow { margin-left: auto; color: var(--muted); font-size: 11px; flex-shrink: 0; transition: color .2s; }
    a.link-row:hover .link-arrow { color: var(--gold); }
    .link-name { font-weight: 600; font-size: .875rem; }
    .link-sub  { font-size: .72rem; color: var(--muted); margin-top: .05rem; }

    /* ─── QUOTE BANNER ─── */
    .quote-banner { background: linear-gradient(135deg,rgba(139,44,0,.2),rgba(245,176,65,.07)); border: 1px solid rgba(245,176,65,.2); border-radius: 14px; padding: 1.4rem; text-align: center; margin-top: 1rem; }
    .quote-banner strong { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--gold); display: block; margin-bottom: .35rem; }
    .quote-banner span { font-size: .82rem; color: var(--muted); }

    /* ─── SIDEBAR / TICKET CARD ─── */
    .sidebar { position: sticky; top: 88px; height: fit-content; }
    .ticket-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .ticket-head { background: linear-gradient(135deg, var(--brand) 0%, #9e3200 100%); padding: 1.5rem; text-align: center; }
    .ticket-head h3 { font-family: 'Playfair Display', serif; font-size: 1.12rem; font-weight: 700; color: #fff; }
    .price-pill { display: inline-block; background: rgba(255,255,255,.18); padding: .22rem .75rem; border-radius: 50px; font-size: .7rem; font-weight: 700; color: #fff; margin-top: .45rem; letter-spacing: .1em; }
    .ticket-body { padding: 1.4rem; }
    .t-row { display: flex; justify-content: space-between; align-items: flex-start; padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .855rem; gap: .5rem; }
    .t-row:last-of-type { border-bottom: none; }
    .t-key { color: var(--muted); flex-shrink: 0; }
    .t-val { font-weight: 600; text-align: right; color: #fff; }
    .t-val.gold  { color: var(--gold); }
    .t-val.green { color: var(--green); }
    .reg-btn { display: block; width: 100%; background: var(--gold); color: #000; border: none; cursor: pointer; padding: 1rem; border-radius: 50px; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; margin-top: 1.4rem; transition: all .2s; box-shadow: 0 4px 20px rgba(245,176,65,.22); }
    .reg-btn:hover { box-shadow: 0 8px 28px rgba(245,176,65,.35); transform: translateY(-2px); }
    .reg-note { text-align: center; margin-top: .6rem; font-size: .74rem; color: var(--muted); line-height: 1.55; }

    /* sidebar zoom */
    .sidebar-zoom { margin-top: 1.1rem; border-top: 1px solid var(--border); padding-top: 1.1rem; }
    .sidebar-zoom-label { font-size: .67rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: .55rem; }
    .sidebar-zoom-btn { display: flex; align-items: center; gap: .55rem; padding: .7rem 1rem; border-radius: 10px; background: var(--zoom); color: #fff; text-decoration: none; font-size: .85rem; font-weight: 700; transition: all .2s; margin-bottom: .45rem; }
    .sidebar-zoom-btn:hover { background: #1a7aff; transform: translateX(2px); }
    .sidebar-social-links { display: flex; gap: .45rem; margin-top: .45rem; }
    .sidebar-social-btn { display: flex; align-items: center; justify-content: center; gap: .45rem; flex: 1; padding: .62rem .5rem; border-radius: 9px; color: #fff; text-decoration: none; font-size: .8rem; font-weight: 600; transition: all .2s; }
    .sidebar-social-btn:hover { transform: translateY(-2px); opacity: .88; }

    /* ─── MODAL ─── */
    .modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .3s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--card); border: 1px solid var(--gold-border); border-radius: 20px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; transform: translateY(22px); transition: transform .3s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-head { padding: 1.75rem 1.75rem .95rem; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-head h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--gold); }
    .modal-head p { font-size: .82rem; color: var(--muted); margin-top: .2rem; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.4rem; line-height: 1; padding: 0; transition: color .25s; }
    .modal-close:hover { color: var(--gold); }
    .modal-body { padding: 1.75rem; }
    .fg { margin-bottom: 1.2rem; }
    .fg label { display: block; font-size: .77rem; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: .45rem; }
    .fg input, .fg select { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: .82rem 1rem; color: var(--light); font-family: 'Inter', sans-serif; font-size: .93rem; outline: none; transition: border-color .2s; }
    .fg input:focus, .fg select:focus { border-color: var(--gold); }
    .fg input::placeholder { color: rgba(120,120,120,.6); }
    .fg select option { background: var(--card2); }
    .sub-btn { width: 100%; background: var(--gold); color: #000; border: none; cursor: pointer; padding: 1rem; border-radius: 50px; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: .5rem; transition: all .2s; box-shadow: 0 4px 20px rgba(245,176,65,.22); }
    .sub-btn:hover:not(:disabled) { box-shadow: 0 8px 28px rgba(245,176,65,.35); transform: translateY(-1px); }
    .sub-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .spin { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,.25); border-top-color: #000; border-radius: 50%; animation: rot .8s linear infinite; display: none; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .sub-btn.loading .spin { display: block; }
    .sub-btn.loading .btn-txt { display: none; }
    #formError { color: #f87171; font-size: .82rem; margin-bottom: .7rem; display: none; }
    .success-wrap { text-align: center; padding: 2rem; }
    .success-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(52,211,153,.1); border: 2px solid var(--green); margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .success-wrap h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--green); margin-bottom: .45rem; }
    .success-wrap p { color: var(--muted); font-size: .87rem; line-height: 1.65; }
    .ticket-code { background: var(--card2); border: 1px solid var(--gold-border); border-radius: 10px; padding: 1rem; font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--gold); letter-spacing: .1em; margin: 1rem 0; word-break: break-all; }
    .view-ticket { display: block; width: 100%; background: var(--gold); color: #000; border: none; cursor: pointer; padding: .85rem; border-radius: 50px; font-family: 'Playfair Display', serif; font-size: .95rem; font-weight: 700; text-decoration: none; margin-top: 1rem; text-align: center; transition: all .2s; }
    .view-ticket:hover { box-shadow: 0 8px 28px rgba(245,176,65,.3); }

    /* ─── TOAST ─── */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(14px); background: var(--card); border: 1px solid var(--gold-border); color: var(--gold); padding: .58rem 1.5rem; border-radius: 50px; font-size: .83rem; font-weight: 600; opacity: 0; transition: all .3s; z-index: 10000; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── LOADING ─── */
    .loading-wrap { height: 72vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .spin-lg { width: 46px; height: 46px; border: 3px solid rgba(245,176,65,.18); border-top-color: var(--gold); border-radius: 50%; animation: rot .8s linear infinite; }
    .loading-wrap p { color: var(--muted); font-size: .9rem; }
  </style>
</head>

/* ── LOAD EVENT ── */
async function loadEvent() {
  if (!eid) { location.href = 'index.html'; return; }
  if (eid === 'fallback-nauru-crusade') { currentEvent = FALLBACK; render(FALLBACK); return; }
  try {
    const snap = await getDoc(doc(db, 'events', eid));
    if (!snap.exists()) throw new Error('not-found');
    currentEvent = { firestoreId: snap.id, ...snap.data() };
    render(currentEvent);
  } catch (e) {
    console.warn('Firestore fallback:', e.message);
    currentEvent = FALLBACK;
    render(FALLBACK);
  }
}

/* ── RENDER ── */
function render(ev) {

  const start = ev.eventDateISO ? new Date(ev.eventDateISO) : null;
  const end   = start ? new Date(start.getTime() + 4 * 3600000) : null;

  /* Countdown block */
  const cdHTML = (isFuture || isLive) ? `
    <div class="countdown-wrap" id="cdWrap">

            <div class="cd-box"><span id="cdH">--</span><label>Hours</label></div>
            <div class="cd-box"><span id="cdM">--</span><label>Min</label></div>

    </div>` : '';

  /* Zoom box */

      <div class="zoom-icon-wrap"><i class="fa-solid fa-video"></i></div>
      <div class="zoom-info">
        <h3>Join on Zoom</h3>
        <p>Tap the button to open Zoom and join the live crusade</p>
      </div>
      <a href="${ev.zoomUrl}" target="_blank" rel="noopener noreferrer" class="zoom-join-btn">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Join Now
      </a>
    </div>` : '';

  if (ev.instagramUrl) socialBtns.push(`<a href="${ev.instagramUrl}" target="_blank" rel="noopener noreferrer" class="watch-btn watch-instagram"><i class="fa-brands fa-instagram"></i> Instagram Live</a>`);
  const socialHTML = socialBtns.length ? `
    <div style="margin-bottom:1.6rem;">

  if (ev.tiktokUrl)    watchRows.push(linkRow('fa-brands fa-tiktok', '#000', 'TikTok Live', 'Watch on @jesusalivecrusadenauru', ev.tiktokUrl));
  if (ev.instagramUrl) watchRows.push(linkRow('fa-brands fa-instagram', 'linear-gradient(135deg,#f09433,#dc2743,#bc1888)', 'Instagram Live', 'Watch on @jesusalivecrusadnuaru', ev.instagramUrl));

  /* Follow & connect rows */
  const followRows = [];

        <!-- Banner quote -->

        </div>
      </div>

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="ticket-card">
          <div class="ticket-head">
            <h3>Get Your ${ev.ticketType==='free'?'Free ':''}Ticket</h3>
            <div class="price-pill">${ev.ticketType==='free'?'100% FREE':ev.ticketPrice||'PAID'}</div>
          </div>
          <div class="ticket-body">
            <div class="t-row"><span class="t-key">Event</span><span class="t-val">${ev.title}</span></div>

            <div class="t-row"><span class="t-key">Format</span><span class="t-val">${ev.venue}</span></div>

/* ── LINK ROW HELPER ── */
function linkRow(iconClass, bg, name, sub, url) {
  const inner = `
    <div class="link-icon" style="background:${bg}"><i class="${iconClass}" style="color:#fff;font-size:14px;"></i></div>
    <div><div class="link-name">${name}</div><div class="link-sub">${sub}</div></div>
    ${url ? '<i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>' : ''}`;
  return url
    ? `<a class="link-row" href="${url}" target="_blank" rel="noopener noreferrer">${inner}</a>`
    : `<div class="link-row">${inner}</div>`;
}

/* ── COUNTDOWN ── */
function startCountdown(target) {
  function tick() {
    const diff = target - new Date();
    if (diff <= 0) {
      const w = document.getElementById('cdWrap');
      if (w) w.innerHTML = '<div class="cd-live"><div class="live-dot"></div> The event is live — join now!</div>';
      return;
    }
    const p = n => String(n).padStart(2,'0');
    const $ = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = p(v); };
    $('cdD', Math.floor(diff / 86400000));
    $('cdH', Math.floor((diff % 86400000) / 3600000));
    $('cdM', Math.floor((diff % 3600000) / 60000));
    $('cdS', Math.floor((diff % 60000) / 1000));
  }
  tick();
  setInterval(tick, 1000);
}

/* ── SHARE ── */
window.shareEvent = async () => {
  const url = location.href;
  if (navigator.share) {
    try { await navigator.share({ title: currentEvent?.title || 'Event', url }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(url);
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  } catch {}
};

/* ── REGISTRATION ── */
function genCode(name) {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r = '';
  for (let i = 0; i < 6; i++) r += c[Math.floor(Math.random() * c.length)];
  return 'NF-' + (name||'EVENT').toUpperCase().replace(/\s+/g,'').slice(0,6) + '-' + r;
}

async function sendEmail(p) {
  if (!EMAILJS_KEY || EMAILJS_KEY === 'YOUR_EMAILJS_PUBLIC_KEY') return;
  try { emailjs.init({ publicKey: EMAILJS_KEY }); await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, p); }
  catch (e) { console.warn('Email failed:', e); }
}

window.submitReg = async () => {
  const name    = document.getElementById('fName').value.trim();
  const email   = document.getElementById('fEmail').value.trim();
  const phone   = document.getElementById('fPhone').value.trim();
  const country = document.getElementById('fCountry').value;
  const errEl   = document.getElementById('formError');
  const btn     = document.getElementById('subBtn');
  errEl.style.display = 'none';
  if (!name)              { errEl.textContent = 'Please enter your full name.';     errEl.style.display = 'block'; return; }
  if (!email?.includes('@')) { errEl.textContent = 'Please enter a valid email address.'; errEl.style.display = 'block'; return; }
  if (!phone)             { errEl.textContent = 'Please enter your phone number.';  errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.classList.add('loading');
  try {
    const code = genCode(currentEvent.title);
    const data = {
      eventId: currentEvent.firestoreId, eventName: currentEvent.title,
      eventDate: currentEvent.date, eventTime: currentEvent.time,
      eventVenue: currentEvent.venue, bannerUrl: currentEvent.bannerUrl || '',
      organizer: currentEvent.organizer || '', name, email, phone,
      country: country || 'Not specified', ticketCode: code, used: false, createdAt: serverTimestamp()
    };
    const ref = await addDoc(collection(db, 'tickets'), data);
    const local = { ...data, docId: ref.id, createdAt: new Date().toISOString() };
    sessionStorage.setItem('nfe_ticket', JSON.stringify(local));
    localStorage.setItem('nfe_last_ticket', JSON.stringify(local));
    const all = JSON.parse(localStorage.getItem('nfe_all_tickets') || '[]');
    all.unshift({ ticketCode: code, eventName: currentEvent.title, email, name, createdAt: new Date().toISOString() });
    localStorage.setItem('nfe_all_tickets', JSON.stringify(all.slice(0, 20)));
    sendEmail({ to_name: name, to_email: email, ticket_code: code, event_name: currentEvent.title, event_date: currentEvent.date, event_time: currentEvent.time, event_venue: currentEvent.venue, ticket_url: location.origin + '/events/ticket.html' });
    document.getElementById('formState').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
    document.getElementById('codeDisplay').textContent = code;
    document.getElementById('emailNote').textContent = 'Confirmation details sent to ' + email;
  } catch (err) {
    console.error(err);
    errEl.textContent = 'Registration failed. Please check your connection and try again.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.classList.remove('loading');
  }
};

window.openModal  = () => { document.getElementById('modalOverlay').classList.add('open');    document.body.style.overflow = 'hidden'; };
window.closeModal = () => { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; };
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

loadEvent();
</script>
